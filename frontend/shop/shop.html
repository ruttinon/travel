<!doctype html>
<html lang="th">
<head>
  <!-- SME shop page (owner: Tommy, 2026-11-06). Opened as /shop/<place id> from the map or a shared link.
       Content comes from /api/shop-pages/<id>; drawing is done by /shop-render.js (shared with the editor preview). -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D2C1C" />
  <title>ร้านค้า · GoAround</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/shop-render.css" />
  <script>
    // Tommy (2026-11-23): use the light/dark choice the visitor made in the GoAround app (same key as app.js)
    try { if (localStorage.getItem('traval-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <style>
    html,body{margin:0;background:#E9ECE6;min-height:100%}
    .shop-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:10px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #E8ECE6;font-family:'Prompt',sans-serif}
    .shop-top a{display:inline-flex;align-items:center;gap:6px;color:#0D2C1C;text-decoration:none;font-weight:500;font-size:14px;padding:8px 10px;border-radius:99px;min-height:40px}
    .shop-top a:hover{background:#F1F4EF}
    .shop-top .brand{margin-left:auto;font-weight:700;letter-spacing:-.3px}
    .shop-top .brand b{color:#82c92d}
    .shop-msg{max-width:560px;margin:40px auto;padding:32px 20px;text-align:center;font-family:'Prompt',sans-serif;color:#57685D}
    .shop-msg h1{color:#0D2C1C;font-size:22px;margin:0 0 8px}
    .shop-msg a{color:#1E5538;font-weight:600}
    .shop-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0D2C1C;color:#fff;padding:10px 18px;border-radius:99px;font:500 13px 'Prompt',sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}
    .shop-toast.on{opacity:1}
    html[data-theme="dark"],html[data-theme="dark"] body{background:#0B100D;color-scheme:dark}
    html[data-theme="dark"] .shop-top{background:rgba(17,23,19,.92);border-color:#26302A}
    html[data-theme="dark"] .shop-top a,html[data-theme="dark"] .shop-top .brand{color:#E8EDE9}
    html[data-theme="dark"] .shop-top a:hover{background:#1B231E}
    html[data-theme="dark"] .shop-msg{color:#A3B3A8}html[data-theme="dark"] .shop-msg h1{color:#E8EDE9}
  </style>
</head>
<body>
  <div class="shop-top">
    <a href="/#map" id="backLink"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>กลับไปที่แผนที่</a>
    <span class="brand">GoAround<b>.</b></span>
  </div>
  <main id="shop" aria-live="polite"><div class="shop-msg">กำลังโหลดหน้าร้าน…</div></main>
  <div class="shop-toast" id="toast" role="status"></div>
  <script src="/maps-links.js"></script>
  <script src="/shop-render.js"></script>
  <script src="/shop.js"></script>
</body>
</html>
