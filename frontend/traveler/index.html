<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
 <meta name="theme-color" content="#0D2C1C"/>
 <meta name="description" content="Traval — Travel & Local Discovery for Thai and international travellers."/>
 <meta name="color-scheme" content="light"/>
 <meta name="apple-mobile-web-app-capable" content="yes"/>
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
 <link rel="icon" type="image/png" href="assets/icon-192.png" />
 <!-- Traval design system: Prompt (Thai) + Inter (Latin) -->
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" />
 <!-- file:// cannot load the PWA manifest in Chrome; use OPEN-WINDOWS.cmd for full PWA support. -->
 <script>
   if (location.protocol === 'http:' || location.protocol === 'https:') {
     const manifestLink = document.createElement('link');
     manifestLink.rel = 'manifest';
     manifestLink.href = './manifest.webmanifest';
     document.head.appendChild(manifestLink);
   }
 </script>
 <link rel="stylesheet" href="styles.css" />
 <title>Traval — Discover locally</title>
</head>
<body>
 <a class="skip-link" href="#app">Skip to content</a>
 <div id="app"></div>
 <div id="toast" class="toast" aria-live="polite" role="status"></div>
 <!-- Tommy: shared travel tools (frontend/shared/) — load before app.js -->
 <script src="trip-engine.js" defer></script>
 <script src="map-gestures.js" defer></script>
 <script src="road-route.js" defer></script>
 <script src="travel-cost.js" defer></script>
 <script src="maps-links.js" defer></script>
 <script src="app.js" defer></script>
</body>
</html>
