<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
 <meta name="theme-color" content="#143B2A"/>
 <meta name="application-name" content="GoAround"/>
 <meta name="apple-mobile-web-app-title" content="GoAround"/>
 <meta name="apple-mobile-web-app-capable" content="yes"/>
 <meta name="mobile-web-app-capable" content="yes"/>
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
 <meta name="description" content="GoAround — Travel & Local Discovery for Thai and international travellers. Discover Hidden Gems and Local SMEs across Thailand."/>
 <meta name="color-scheme" content="light dark"/>
 <script>
   (function(){
     var t=localStorage.getItem('traval-theme');
     var theme=(t==='dark')?'dark':'light';
     document.documentElement.setAttribute('data-theme',theme);
   })();
 </script>
 <link rel="icon" type="image/png" href="assets/icon-192.png" />
 <link rel="apple-touch-icon" href="assets/icon-192.png" />
 <!-- GoAround design system: Prompt (Thai) + Inter (Latin) -->
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" />
 <!-- PWA Manifest & Service Worker Registration for GoAround App Mode -->
 <script>
   window.deferredGoAroundPrompt = null;
   window.addEventListener('beforeinstallprompt', function(e) {
     e.preventDefault();
     window.deferredGoAroundPrompt = e;
   });
   if (location.protocol === 'http:' || location.protocol === 'https:') {
     const manifestLink = document.createElement('link');
     manifestLink.rel = 'manifest';
     manifestLink.href = './manifest.webmanifest';
     document.head.appendChild(manifestLink);
     if ('serviceWorker' in navigator) {
       window.addEventListener('load', function() {
         navigator.serviceWorker.register('./sw.js').catch(function(){});
       });
     }
   }
 </script>
 <link rel="stylesheet" href="styles.css" />
 <title>GoAround — Travel & Local Discovery</title>
</head>
<body>
 <a class="skip-link" href="#app">Skip to content</a>
 <div id="app"></div>
 <div id="toast" class="toast" aria-live="polite" role="status"></div>
  <!-- GSAP 3.15.0 Interactive Suite (ScrollSmoother + ScrollToPlugin + ScrollTrigger + SplitText + Flip) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollSmoother.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollToPlugin.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Flip.min.js" defer></script>
  <!-- Shared travel tools — load before app.js -->
  <script src="trip-engine.js" defer></script>
  <script src="map-gestures.js" defer></script>
  <script src="road-route.js" defer></script>
  <script src="travel-cost.js" defer></script>
  <script src="maps-links.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
